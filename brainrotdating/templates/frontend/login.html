<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - BrainRot Dating</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Специфичные стили для страниц авторизации */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(to bottom, #312b2f, #97787E);
        }

        .auth-card {
            background: white;
            border-radius: 15px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            font-family: 'Big Shoulders Stencil', sans-serif;
            font-size: 2.5rem;
            color: #EFBDC6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 1rem;
        }

        .auth-logo i {
            font-size: 3rem;
        }

        .auth-subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .auth-form {
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: bold;
            font-family: "Roboto Condensed", sans-serif;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: "Roboto Condensed", sans-serif;
            transition: border 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #EFBDC6;
        }

        .auth-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(to right, #EFBDC6, #97787E);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-family: "Roboto Condensed", sans-serif;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 189, 198, 0.4);
        }

        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-link {
            color: #EFBDC6;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #ffe6e6;
            color: #ff3333;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message {
            background: #e6ffe6;
            color: #33cc33;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            color: #999;
            position: relative;
        }

        .divider:before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
        }

        .social-login {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .social-btn {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: #EFBDC6;
            transform: translateY(-2px);
        }

        .social-btn i {
            font-size: 1.2rem;
        }

        .google { color: #DB4437; }
        .facebook { color: #4267B2; }
        .twitter { color: #1DA1F2; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-brain"></i>
                    BrainRot Dating
                </div>
                <p class="auth-subtitle">Войдите в свой аккаунт</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email или имя пользователя</label>
                    <input type="text" class="form-input" id="username" placeholder="user@example.com или username" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-input" id="password" placeholder="Введите пароль" required>
                </div>

                <div class="form-group" style="text-align: right;">
                    <a href="/reset-password/" class="auth-link">Забыли пароль?</a>
                </div>

                <button type="submit" class="auth-button" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </form>

            <div class="divider">
                <span>Или войти через</span>
            </div>

            <div class="social-login">
                <button class="social-btn google" onclick="socialLogin('google')">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn facebook" onclick="socialLogin('facebook')">
                    <i class="fab fa-facebook"></i> Facebook
                </button>
                <button class="social-btn twitter" onclick="socialLogin('twitter')">
                    <i class="fab fa-twitter"></i> Twitter
                </button>
            </div>

            <div class="auth-links">
                <p>Нет аккаунта? <a href="/register/" class="auth-link">Зарегистрироваться</a></p>
                <p><a href="/" class="auth-link">← Вернуться на главную</a></p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        // Логика входа
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            // Показываем загрузку
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вход...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Сохраняем токен
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    
                    // Показываем успех
                    document.getElementById('successMessage').textContent = data.message || 'Вход успешен!';
                    document.getElementById('successMessage').style.display = 'block';
                    
                    // Редирект через 1.5 секунды
                    setTimeout(() => {
                        if (data.user?.brainrot_character) {
                            window.location.href = '/profile/';
                        } else {
                            window.location.href = '/test/';
                        }
                    }, 1500);
                } else {
                    throw new Error(data.detail || data.message || 'Ошибка входа');
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('errorMessage').style.display = 'block';
            } finally {
                // Восстанавливаем кнопку
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Войти';
                btn.disabled = false;
            }
        });

        function socialLogin(provider) {
            // Временная заглушка
            alert(`Вход через ${provider} временно недоступен. Используйте обычный вход.`);
        }

        // Проверяем если уже залогинен
        if (localStorage.getItem('access_token')) {
            window.location.href = '/profile/';
        }
    </script>
</body>
</html>
